services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-electroncash}
      POSTGRES_USER: ${POSTGRES_USER:-electroncash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-electroncash}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-electroncash} -d ${POSTGRES_DB:-electroncash}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-electroncash}:${POSTGRES_PASSWORD:-electroncash}@db:5432/${POSTGRES_DB:-electroncash}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      IMAGE_DIR: /data/images
      IMAGE_MAX_BYTES: ${IMAGE_MAX_BYTES:-10485760}
      DELETE_IMAGES_WHEN_OUT_OF_STOCK: ${DELETE_IMAGES_WHEN_OUT_OF_STOCK:-true}
    volumes:
      - imagedata:/data/images
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  imagedata:
